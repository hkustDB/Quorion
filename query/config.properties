# Python config
python3.bin=python3

# PostgreSQL config
pg.db=test

# Experiment config
common.experiment.repeat=3
common.experiment.timeout=7200

# DuckDB execution config
duckdb.threads=64
duckdb.cpu_list=0-63
# Comma-separated benchmark directories, query groups, or SQL files.
# Examples: graph_duckdb,job_duckdb/17f,tpch_duckdb/q14/rewriteYa0.sql
duckdb.excluded_queries=graph_duckdb,lsqb_duckdb,tpch_duckdb
# Reuse only complete logs recorded with the same threads, CPUs, repeats, and timeout.
duckdb.resume_completed=true

# Parser config (SparkSQL Plus)
parser.mode=local
parser.hdfs.host=localhost
parser.hdfs.port=50070
parser.hdfs.user=sqlplus
