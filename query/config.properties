# Python config
python3.bin=python3

# PostgreSQL config
pg.db=test

# Experiment config
common.experiment.repeat=3
common.experiment.timeout=7200

# DuckDB execution config
duckdb.threads=64
duckdb.cpu_list=0-15,24-71
# Exact, comma-separated IDs. Examples: graph/q1a,job/17f,tpch/q14/rewriteYa0.sql
duckdb.excluded_queries=graph_duckdb/q1a,graph_duckdb/q1b,graph_duckdb/q1c,graph_duckdb/q2a,graph_duckdb/q2b,graph_duckdb/q3a,graph_duckdb/q3b,graph_duckdb/q3c,graph_duckdb/q4a,graph_duckdb/q4b,graph_duckdb/q5a_dblp,graph_duckdb/q5a_epinions,graph_duckdb/q5a_google,graph_duckdb/q6
# Reuse only complete logs recorded with the same threads, CPUs, repeats, and timeout.
duckdb.resume_completed=true

# Parser config (SparkSQL Plus)
parser.mode=local
parser.hdfs.host=localhost
parser.hdfs.port=50070
parser.hdfs.user=sqlplus
